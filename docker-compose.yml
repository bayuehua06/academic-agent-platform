services:
  db:
    image: postgres:16-alpine
    container_name: academic-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: academic_secret
      POSTGRES_DB: academic_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic -d academic_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
