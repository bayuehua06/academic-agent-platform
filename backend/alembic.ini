# Academic Agent Platform - Alembic 配置占位
# 生产环境建议：alembic init 后用 migration 替代 create_all

[alembic]
script_location = app/db/migrations
sqlalchemy.url = postgresql+asyncpg://academic:academic_secret@localhost:5432/academic_agent

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
